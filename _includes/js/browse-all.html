<script>
    (function() {
        const projectData = [
            {% assign listDocs = site.data.dsi-research-projects | where_exp: 'i','i.ignore != true' %}
            {% for i in listDocs %}
            {
                title: {{ i.title | jsonify }},
                link: {{ i.link | relative_url | jsonify }},
                image: {% if i.image %}{{ i.image | relative_url | jsonify }}{% else %}null{% endif %},
                imageAlt: {{ i.image_alt | default: i.title | jsonify }},
                type: {{ i.type | default: '' | jsonify }},
                status: {{ i.status | default: 'unknown' | jsonify }},
                subjects: {{ i.subjects | default: '' | jsonify }}
            }{% unless forloop.last %},{% endunless %}
            {% endfor %}
        ];

        for (let index = projectData.length - 1; index > 0; index -= 1) {
            const randomIndex = Math.floor(Math.random() * (index + 1));
            const project = projectData[index];
            projectData[index] = projectData[randomIndex];
            projectData[randomIndex] = project;
        }

        const projectBrowse = document.getElementById('projectBrowse');
        const projectCards = document.getElementById('projectCards');
        const topSearchInput = document.getElementById('topProjectSearch');
        const topSearchButton = document.getElementById('topProjectSearchButton');
        const searchInput = document.getElementById('projectSearch');
        const typeSelect = document.getElementById('projectType');
        const topTopicFilters = document.getElementById('topTopicFilters');
        const topicFilters = document.getElementById('topicFilters');

        if (!projectBrowse || !projectCards || !searchInput || !typeSelect || !topicFilters) {
            return;
        }

        const searchInputs = [topSearchInput, searchInput].filter(Boolean);
        const topicFilterGroups = [topTopicFilters, topicFilters].filter(Boolean);

        let activeTopic = 'all';
        let activeType = 'all';
        let searchTerm = '';

        function getBorderClass(type) {
            const palette = {
                exhibit: 'border-success',
                workshop: 'border-primary',
                'collections as data': 'border-danger',
                'digital collection': 'border-warning',
                'student project': 'border-info',
                'digital scholarship': 'border-secondary'
            };
            return palette[type] || 'border-secondary';
        }

        function normalizeSubject(value) {
            return (value || '').split(';').map(function(part) {
                return part.trim();
            }).filter(Boolean);
        }

        function normalizeType(value) {
            return (value || '').split(';').map(function(part) {
                return part.trim();
            }).filter(Boolean);
        }

        function renderTypeOptions() {
            const types = [];

            projectData.forEach(function(project) {
                normalizeType(project.type).forEach(function(type) {
                    if (!types.includes(type)) {
                        types.push(type);
                    }
                });
            });

            types.sort();
            typeSelect.innerHTML = '<option value="all">All types</option>' + types.map(function(type) {
                return '<option value="' + type + '">' + type + '</option>';
            }).join('');
        }

        function getTopTopics() {
            const counts = {};

            projectData.forEach(function(project) {
                normalizeSubject(project.subjects).forEach(function(subject) {
                    counts[subject] = (counts[subject] || 0) + 1;
                });
            });

            return Object.entries(counts)
                .sort(function(a, b) {
                    return b[1] - a[1];
                })
                .slice(0, 8)
                .map(function(entry) {
                    return entry[0];
                });
        }

        function renderTopicFilters(container) {
            const topTopics = getTopTopics();
            const buttons = [
                '<button type="button" class="btn btn-sm btn-outline-primary ' + (activeTopic === 'all' ? 'active' : '') + '" data-topic="all">All</button>'
            ];

            topTopics.forEach(function(topic) {
                buttons.push('<button type="button" class="btn btn-sm btn-outline-primary ' + (activeTopic === topic ? 'active' : '') + '" data-topic="' + topic + '">' + topic + '</button>');
            });

            container.innerHTML = buttons.join('');

            const topicButtons = Array.from(container.querySelectorAll('[data-topic]'));
            topicButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    activeTopic = button.dataset.topic;
                    renderTopicFiltersForAll();
                    renderCards();
                });
            });
        }

        function renderTopicFiltersForAll() {
            topicFilterGroups.forEach(function(container) {
                renderTopicFilters(container);
            });
        }

        function renderCards() {
            const filtered = projectData.filter(function(project) {
                const projectSubjects = normalizeSubject(project.subjects);
                const matchesTopic = activeTopic === 'all' || projectSubjects.includes(activeTopic);
                const projectTypes = normalizeType(project.type);
                const matchesType = activeType === 'all' || projectTypes.includes(activeType);
                const haystack = [project.title, project.type, project.status, project.subjects].join(' ').toLowerCase();
                const matchesSearch = !searchTerm || haystack.includes(searchTerm.toLowerCase());
                return matchesTopic && matchesType && matchesSearch;
            });

            if (!filtered.length) {
                projectCards.innerHTML = '<div class="col-12"><div class="alert alert-light border">No projects match your current search.</div></div>';
                return;
            }

            projectCards.innerHTML = filtered.map(function(project) {
                const image = project.image ? '<p class="text-center mb-3"><img src="' + project.image + '" class="img-fluid list-img" alt="' + project.imageAlt + '"></p>' : '';
                const projectTypes = normalizeType(project.type);
                const subjectList = normalizeSubject(project.subjects).slice(0, 3).join(' • ');

                return '<div class="col">' +
                    '<div class="card h-100 border ' + getBorderClass(projectTypes[0]) + ' shadow-sm project-card">' +
                        '<div class="card-body d-flex flex-column">' +
                            '<h3 class="card-title mt-0"><a href="' + project.link + '" target="_blank" rel="noopener">' + project.title + '</a></h3>' +
                            '<p class="mb-2"><strong>' + (projectTypes.length ? projectTypes.join(' • ') : 'Project') + '</strong></p>' +
                            image +
                            (subjectList ? '<div class="small text-muted mb-2">' + subjectList + '</div>' : '') +
                            '<div class="mt-auto pt-2"><a class="btn btn-sm btn-outline-primary" href="' + project.link + '" target="_blank" rel="noopener">Explore project</a></div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        typeSelect.addEventListener('change', function(event) {
            activeType = event.target.value;
            renderCards();
        });

        function updateSearch(value) {
            searchTerm = value.trim();
            searchInputs.forEach(function(input) {
                input.value = value;
            });
            renderCards();
        }

        function submitTopSearch() {
            updateSearch(topSearchInput.value);
            projectBrowse.scrollIntoView({ behavior: 'smooth', block: 'start' });
            searchInput.focus();
            searchInput.select();
        }

        searchInput.addEventListener('input', function(event) {
            updateSearch(event.target.value);
        });

        if (topSearchInput) {
            topSearchInput.addEventListener('input', function(event) {
                updateSearch(event.target.value);
            });

            topSearchInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    submitTopSearch();
                }
            });
        }

        if (topSearchButton) {
            topSearchButton.addEventListener('click', submitTopSearch);
        }

        renderTypeOptions();
        renderTopicFiltersForAll();
        renderCards();
    })();
</script>
